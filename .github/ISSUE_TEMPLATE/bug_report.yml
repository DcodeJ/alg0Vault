name: Bug report
description: Report a reproducible alg0Vault problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: "1. Open...\n2. Click...\n3. Observe..."
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      options: [Current, Dark, Purple, White, Not applicable]
